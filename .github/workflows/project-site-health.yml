name: Daily GitHub Pages project health check
on:
  push:
    branches: [main]
    paths: ['scripts/check_pages.py', '.github/workflows/project-site-health.yml']
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-public-sites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check published project URLs and redirects
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_pages.py
